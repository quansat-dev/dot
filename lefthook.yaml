assert_lefthook_installed: true
min_version: 2.0.0
glob_matcher: doublestar
pre-commit:
  follow: true
  piped: true
  skip:
    - merge
    - rebase
  jobs:
    - name: engine
      root: engine
      group:
        parallel: false
        jobs:
          - name: check
            run: zig ast-check
            stage_fixed: true
          - name: format
            run: zig fmt
            stage_fixed: true
commit-msg:
  jobs:
    - name: conventional
      run: ./scripts/commit-lint.sh {1}
